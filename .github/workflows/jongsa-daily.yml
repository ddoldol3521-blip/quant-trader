name: QuantMix cloud Telegram

on:
  schedule:
    # KST 21:10. Exchange holidays are checked by the runner.
    - cron: "10 12 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate without sending Telegram"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: quantmix-telegram-delivery
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      QUANTMIX_PROFILE_JSON: ${{ secrets.QUANTMIX_PROFILE_JSON }}
      QUANTMIX_STATE_KEY: ${{ secrets.QUANTMIX_STATE_KEY }}
      GH_TOKEN: ${{ github.token }}
      QUANTMIX_REPOSITORY: ${{ github.repository }}
      QUANTMIX_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-notify.txt
      - name: Install notification dependencies
        run: python -m pip install -r requirements-notify.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -p test_quantmix_cloud.py -v
      - name: Calculate and deliver
        run: python scripts/quantmix_cloud_notify.py
      - name: Report failure without exposing account information
        if: failure()
        run: python scripts/quantmix_cloud_failure.py
